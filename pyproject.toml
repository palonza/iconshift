[project]
name = "iconshift"
version = "1.1.0"
description = "Universal icon resolver and theme generator for Linux desktop environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
iconshift = "iconshift.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iconshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
